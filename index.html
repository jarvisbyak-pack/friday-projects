<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIDAY | MATRIX INTERFACE</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    <div id="ui-overlay">
        <div class="black-hole" id="blackHole"></div>
        <div id="system-status">SYSTEM: ACTIVE [LISTENING...]</div>
        <div id="chat-output"></div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Enter command..." autofocus>
            <label for="file-upload" class="file-label">UPLOAD</label>
            <input type="file" id="file-upload" style="display: none;">
        </div>
        <div id="drop-zone">Drop files to analyze</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
